[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "atomvar"
version = "0.1.0"
description = "Lock-free atomic variables for Python: in-process or in named shared memory"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Operating System :: POSIX :: Linux",
]

[tool.maturin]
module-name = "atomvar._atomvar"
python-source = "python"
